services:
  api:
    command: "uvicorn ring.fastapp.fast:app --log-level info --proxy-headers --host 0.0.0.0 --port ${API_PORT} --reload"
    ports:
      - "${API_PORT}:${API_PORT}"
    expose:
      - "${API_PORT}"
    env_file:
      - ./.env
    environment:
      - RING_GIT_SHA=${RING_GIT_SHA:-}
      - RING_GIT_SHORT_SHA=${RING_GIT_SHORT_SHA:-}
      - RING_GIT_BRANCH=${RING_GIT_BRANCH:-}
      - RING_GIT_SUBJECT=${RING_GIT_SUBJECT:-}
      - RING_GIT_AUTHOR_NAME=${RING_GIT_AUTHOR_NAME:-}
      - RING_GIT_AUTHOR_EMAIL=${RING_GIT_AUTHOR_EMAIL:-}
      - RING_GIT_COMMITTED_AT=${RING_GIT_COMMITTED_AT:-}
      - RING_GIT_DIRTY=${RING_GIT_DIRTY:-}
    depends_on:
      - cockroach
    links:
      - cockroach

  nginx:
    volumes:
      - ./dev.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./localhost.crt:/etc/nginx/certs/nginx-selfsigned.crt:ro
      - ./localhost.key:/etc/nginx/certs/nginx-selfsigned.key:ro
      - ./react/dist:/usr/share/nginx/html
  cockroach:
    image: cockroachdb/cockroach:v25.2.1
    container_name: ring-cockroach
    restart: unless-stopped
    profiles: [ "dev" ]
    command: start-single-node --certs-dir=/root/.cockroach-certs
    ports:
      - 26257:26257
      - 8007:8080
    environment:
      - COCKROACH_USER=ringcockroach
      - COCKROACH_PASSWORD=ringcockroach
      - COCKROACH_DATABASE=ring
    volumes:
      - cockroach-data:/cockroach/cockroach-data
      - ./certs:/root/.cockroach-certs
    networks:
      - default

networks:
  default:
    name: ring-network
    external: true

volumes:
  cockroach-data:
