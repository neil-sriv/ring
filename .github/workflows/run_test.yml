name: Run Unit Tests via pytest

on:
  push:
    branches:
      - dev
  pull_request:
    # Run for all PRs regardless of base to better support stacked PRs
  workflow_call:
    inputs:
      ref:
        description: "Git ref / SHA to test (default: caller github.sha)"
        required: false
        type: string

jobs:
  build:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
    
    - name: Sync uv
      run: |
        uv sync --all-extras
        source .venv/bin/activate
    
    - name: Install project
      run: uv pip install -e .
    
    - name: Docker set-up
      run: |
        docker login ghcr.io -u neil-sriv -p ${{ secrets.GITHUB_TOKEN }}
        docker pull ghcr.io/neil-sriv/ring/ring-test-runner:latest &
        test_runner_pull_pid=$!
        uv run ring compose any --profile test pull test-cockroach &
        cockroach_pull_pid=$!
        wait "$test_runner_pull_pid"
        wait "$cockroach_pull_pid"
        docker tag ghcr.io/neil-sriv/ring/ring-test-runner:latest ring-test-runner:latest
        docker rmi ghcr.io/neil-sriv/ring/ring-test-runner:latest
        docker network create ring-network

    - name: Run tests
      run: uv run ring test run
    