name: Deploy ring-api

# Phase 4 of continuous deploy (docs/continuous-deploy.md): backend merges
# to `dev` deploy themselves. The host script is the interface; this job
# only SSHs and runs it.
#
# Triggering on workflow_run rather than `push: dev` is deliberate: the image
# has to exist before we deploy, and a push trigger would race publish_api.
# It also inherits that workflow's backend path filter, so docs-only merges
# deploy nothing.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Published ring-api image tag (git SHA). Empty = this ref.
        required: false
        type: string
  workflow_run:
    workflows: ["Publish ring-api"]
    types: [completed]
    branches: [dev]

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  ECR_IMAGE: public.ecr.aws/z2k1e8p1/ring-api

jobs:
  resolve:
    name: Resolve SHA
    # A failed publish must not deploy the previous image over a newer one.
    # DEPLOY_PAUSED freezes the automatic path during an incident; manual
    # dispatch stays open so a rollback is still one click away.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       vars.DEPLOY_PAUSED != 'true')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick target SHA
        id: sha
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ inputs.sha }}"
          fi
          if [[ -z "$sha" ]]; then
            sha="${{ github.sha }}"
          fi
          sha="$(git rev-parse --verify "${sha}^{commit}")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Deploy target ${sha}"

      - name: Require published image
        run: |
          sha="${{ steps.sha.outputs.sha }}"
          if ! docker manifest inspect "${{ env.ECR_IMAGE }}:${sha}" >/dev/null; then
            echo "No ${{ env.ECR_IMAGE }}:${sha}. Wait for Publish ring-api, or pass a SHA that job tagged." >&2
            exit 1
          fi

  test:
    name: Backend tests
    needs: resolve
    uses: ./.github/workflows/run_test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  migrations:
    name: Migration check
    needs: resolve
    uses: ./.github/workflows/check_migrations.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  deploy:
    name: Roll out on EC2
    needs: [resolve, test, migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: SSH deploy_host.sh
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ vars.PROD_SSH_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.PROD_APP_DIR }}"
            if [[ -z "$APP_DIR" ]]; then
              APP_DIR="$HOME/ring"
            fi
            cd "$APP_DIR"
            ./dev_util/deploy_host.sh --rollback-on-fail "${{ needs.resolve.outputs.sha }}"

      # Append-only history for `ring deploy history` / rollback picks.
      # Best-effort: a bookkeeping failure must not fail a successful host
      # rollout (or hide it from history when conclusion != success).
      - name: Record GitHub Deployment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ needs.resolve.outputs.sha }}';
            const event = '${{ github.event_name }}';
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'production-api',
              auto_merge: false,
              required_contexts: [],
              description: `ring-api ${sha.slice(0, 7)} via ${event}`,
              payload: {
                event,
                workflow: 'Deploy ring-api',
                run_id: context.runId,
              },
            });
            const id = deployment.data?.id;
            if (!id) {
              core.warning(
                `createDeployment returned no id (status ${deployment.status}); ` +
                  'skipping deployment status. Host rollout already succeeded.'
              );
              return;
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: id,
              state: 'success',
              environment: 'production-api',
              environment_url: 'https://ring.neilsriv.tech',
              description: 'deploy_host.sh completed',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`Recorded production-api deployment ${sha}`);
