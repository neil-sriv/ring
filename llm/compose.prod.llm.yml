services:
  llm:
    image: prod-ring-llm
    command: "uvicorn llm.fast:app --proxy-headers --host 0.0.0.0 --port ${LLM_PORT:-8006}"
    profiles:
      - prod
    mem_limit: 300m
    platform: linux/amd64
    volumes: []
    # Same CloudWatch shipping as compose.prod.yml (anchors do not cross
    # files). Requires the same IAM policy on the EC2 instance role.
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /ring/prod
        awslogs-create-group: "true"
        awslogs-stream: llm
        mode: non-blocking

networks:
  ring-network:
    external: true
