# This origin only serves the API and ACME challenges. The SPA (including
# /serviceWorker.js and /manifest.webmanifest) comes from the Cloudflare
# ring-frontend Worker, which owns ring.neilsriv.tech/* via Workers Routes;
# only /api/* and /.well-known/* pass through to this host.
server {
    listen 80;
    # server_name http://34.203.31.64;
    # server_name http://ec2-54-221-74-168.compute-1.amazonaws.com;
    server_name ring.neilsriv.tech www.ring.neilsriv.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name ring.neilsriv.tech www.ring.neilsriv.tech;
    ssl_certificate     /etc/letsencrypt/live/ring.neilsriv.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ring.neilsriv.tech/privkey.pem;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location ^~ /api/v1/ws/ {
        proxy_pass http://ring-api:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1 {
        return 302 /api/v1/;
    }

    location /api/v1/ {
        proxy_pass http://ring-api:8001/;
        client_max_body_size 500M;

        # Timeout settings to prevent hanging requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/v1/docs {
        return 404;
    }

    location /api/v1/redoc {
        return 404;
    }

    # Non-API paths never reach this origin through Cloudflare (the /*
    # route serves the Worker). Direct origin hits get a 404 rather than
    # a redirect so a missing Workers Route cannot create a loop.
    location / {
        return 404;
    }
}