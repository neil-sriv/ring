## Prod nginx serves the API only. The frontend is served by the
## Cloudflare Worker `ring-frontend`; zone Workers Routes send
## ring.neilsriv.tech/* to the Worker and pass /api/* and
## /.well-known/* through to this origin.

server {
    listen 80;
    server_name ring.neilsriv.tech www.ring.neilsriv.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name ring.neilsriv.tech www.ring.neilsriv.tech;
    ssl_certificate     /etc/letsencrypt/live/ring.neilsriv.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ring.neilsriv.tech/privkey.pem;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ^~ /api/v1/ws/ {
        proxy_pass http://ring-api:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1 {
        return 302 /api/v1/;
    }

    location /api/v1/ {
        proxy_pass http://ring-api:8001/;
        client_max_body_size 500M;

        # Timeout settings to prevent hanging requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/v1/docs {
        return 404;
    }

    location /api/v1/redoc {
        return 404;
    }

    # Frontend paths never reach this origin (Workers route); anything
    # that does fall through has no content here.
    location / {
        return 404;
    }
}
