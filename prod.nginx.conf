# Link-preview crawlers (Slack, Discord, iMessage, WhatsApp, ...) read Open
# Graph tags out of the first HTML response and never run JavaScript, so the
# single-page app shell tells them nothing about the URL that was pasted. Their
# page requests go to the API's /unfurl handler instead of the frontend.
map $http_user_agent $ring_link_bot {
    default 0;
    "~*(Slackbot|Discordbot|facebookexternalhit|Facebot|Twitterbot|WhatsApp|TelegramBot|LinkedInBot|SkypeUriPreview|redditbot|Iframely|Embedly|Cardyb|Mastodon)" 1;
}

# The same crawlers fetch og:image after reading the tags, so anything that
# looks like a file keeps going to the real asset. No app route has a dot in its
# last segment; /manifest.webmanifest and /sw.js do.
map $uri $ring_page_request {
    default 1;
    "~*\.[a-z0-9]+$" 0;
}

map $ring_link_bot$ring_page_request $ring_unfurl {
    default 0;
    "11" 1;
}

# Named upstream so proxy_pass can interpolate $uri without needing a resolver.
upstream ring_api_unfurl {
    server ring-api:8001;
}

server {
    listen 80;
    # server_name http://34.203.31.64;
    # server_name http://ec2-54-221-74-168.compute-1.amazonaws.com;
    server_name ring.neilsriv.tech www.ring.neilsriv.tech;

    location /serviceWorker.js {
        include mime.types;
        alias /usr/share/nginx/html/serviceWorker.js;
    }

    location /manifest.webmanifest {
        include mime.types;
        types {
            application/manifest+json  webmanifest;
        }

        alias /usr/share/nginx/html/manifest.webmanifest;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name ring.neilsriv.tech www.ring.neilsriv.tech;
    ssl_certificate     /etc/letsencrypt/live/ring.neilsriv.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ring.neilsriv.tech/privkey.pem;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /serviceWorker.js {
        include mime.types;
        alias /usr/share/nginx/html/serviceWorker.js;
    }

    location /manifest.webmanifest {
        include mime.types;
        types {
            application/manifest+json  webmanifest;
        }

        alias /usr/share/nginx/html/manifest.webmanifest;
    }

    location ^~ /api/v1/ws/ {
        proxy_pass http://ring-api:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1 {
        return 302 /api/v1/;
    }

    location /api/v1/ {
        proxy_pass http://ring-api:8001/;
        client_max_body_size 500M;

        # Timeout settings to prevent hanging requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/v1/docs {
        return 404;
    }

    location /api/v1/redoc {
        return 404;
    }

    location / {
        if ($ring_unfurl) {
            proxy_pass http://ring_api_unfurl/unfurl$uri;
        }

        proxy_pass http://ring-frontend:80/;
    }
}