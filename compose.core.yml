services:
  api:
    restart: unless-stopped
    container_name: ring-api
    build:
      context: ./ring
      dockerfile: ring.Dockerfile
      target: ring
      args:
        RING_GIT_SHA: ${RING_GIT_SHA:-}
        RING_GIT_SHORT_SHA: ${RING_GIT_SHORT_SHA:-}
        RING_GIT_BRANCH: ${RING_GIT_BRANCH:-}
        RING_GIT_SUBJECT: ${RING_GIT_SUBJECT:-}
        RING_GIT_AUTHOR_NAME: ${RING_GIT_AUTHOR_NAME:-}
        RING_GIT_AUTHOR_EMAIL: ${RING_GIT_AUTHOR_EMAIL:-}
        RING_GIT_COMMITTED_AT: ${RING_GIT_COMMITTED_AT:-}
        RING_GIT_DIRTY: ${RING_GIT_DIRTY:-}
      # image: email_circle-api
    command: "uvicorn ring.fastapp.fast:app --proxy-headers"
    volumes:
      - ./ring:/src/ring
      # Live checkout SHA for GET /version (prod bind-mounts this tree with --reload).
      - ./.git:/git:ro
      # Read-only Engine API so /version can report each container's image id/digest.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PYTHONPATH=.
    networks:
      - default

  nginx:
    restart: unless-stopped
    container_name: ring-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - default

networks:
  default:
    name: ring-network
    external: true
