services:
  api:
    image: prod-ring-api
    command: "uvicorn ring.fastapp.fast:app --proxy-headers --host 0.0.0.0 --port ${API_PORT} --reload"
    mem_limit: 300m
    expose:
      - "${API_PORT}"
    env_file:
      - ./.env
    platform: linux/amd64
    volumes:
      - $HOME/.postgresql/root.crt:/root/.postgresql/root.crt

  nginx:
    mem_limit: 300m
    volumes:
      - ./react/dist:/usr/share/nginx/html:ro
      - ./prod.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    profiles: [ "certbot" ]
    command: >-
      certonly --reinstall --webroot --webroot-path=/var/www/certbot --email neilsriv.cs@gmail.com --agree-tos --no-eff-email -d ring.neilsriv.tech
    volumes:
      - ./etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  worker:
    image: prod-ring-worker
    env_file:
      - ./.env
    mem_limit: 250m
    platform: linux/amd64
    volumes:
      - $HOME/.postgresql/root.crt:/root/.postgresql/root.crt
  beat:
    mem_limit: 150m
    image: prod-ring-beat
    env_file:
      - ./.env
    platform: linux/amd64
    volumes:
      - $HOME/.postgresql/root.crt:/root/.postgresql/root.crt

  frontend:
    restart: unless-stopped
    mem_limit: 300m
    container_name: ring-frontend
    image: prod-ring-frontend
    env_file:
      - ./.env
    build:
      context: ./react
      dockerfile: client.Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_MAINTENANCE_MODE=${VITE_MAINTENANCE_MODE}
    platform: linux/amd64
    networks:
      - default

volumes:
  pgdata:
