services:
  api:
    image: prod-ring-api
    command: "uvicorn ring.fastapp.fast:app --proxy-headers --host 0.0.0.0 --port ${API_PORT} --reload"
    mem_limit: 300m
    expose:
      - "${API_PORT}"
    env_file:
      - ./.env
    platform: linux/amd64
    volumes:
      - $HOME/.postgresql/root.crt:/root/.postgresql/root.crt

  nginx:
    mem_limit: 300m
    volumes:
      - ./prod.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
  certbot:
    container_name: certbot
    image: certbot/certbot:latest
    profiles: [ "certbot" ]
    command: >-
      certonly --reinstall --webroot --webroot-path=/var/www/certbot --email neilsriv.cs@gmail.com --agree-tos --no-eff-email -d ring.neilsriv.tech
    volumes:
      - ./etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  pgdata:
