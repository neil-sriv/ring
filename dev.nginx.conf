# Mirrors prod.nginx.conf: link-preview crawlers read Open Graph tags out of the
# first HTML response and never run JavaScript, so they get the API's /unfurl
# handler instead of the single-page app shell.
map $http_user_agent $ring_link_bot {
    default 0;
    "~*(Slackbot|Discordbot|facebookexternalhit|Facebot|Twitterbot|WhatsApp|TelegramBot|LinkedInBot|SkypeUriPreview|redditbot|Iframely|Embedly|Cardyb|Mastodon)" 1;
}

map $uri $ring_page_request {
    default 1;
    "~*\.[a-z0-9]+$" 0;
}

map $ring_link_bot$ring_page_request $ring_unfurl {
    default 0;
    "11" 1;
}

upstream ring_api_unfurl {
    server ring-api:8001;
}

server {
    listen 80;
    listen [::]:80;

    server_name localhost www.localhost;

    location /serviceWorker.js {
        include mime.types;
        alias /usr/share/nginx/html/serviceWorker.js;
    }

    location /manifest.webmanifest {
        include mime.types;
        types {
            application/manifest+json  webmanifest;
        }

        alias /usr/share/nginx/html/manifest.webmanifest;
    }

    # location / {
    #     return 301 https://$host$request_uri;
    # }

}

server {
    listen 443 ssl;

    server_name localhost www.localhost;
    ssl_certificate     /etc/nginx/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /serviceWorker.js {
        include mime.types;
        alias /usr/share/nginx/html/serviceWorker.js;
    }

    location /manifest.webmanifest {
        include mime.types;
        types {
            application/manifest+json  webmanifest;
        }

        alias /usr/share/nginx/html/manifest.webmanifest;
    }

    location ^~ /api/v1/ws/ {
        proxy_pass http://ring-api:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1 {
        return 302 /api/v1/;
    }

    location /api/v1/ {
        proxy_pass http://ring-api:8001/;
        client_max_body_size 500M;

        # Timeout settings to prevent hanging requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        if ($ring_unfurl) {
            proxy_pass http://ring_api_unfurl/unfurl$uri;
        }

        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html =404;
    }
}