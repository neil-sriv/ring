# Override used by `ring cloud prod-db enable`.
# Points the local cloud-agent API at CockroachDB Cloud while keeping Vite →
# localhost:8001 same-origin proxy. Do not use for routine local development.
services:
  api:
    volumes:
      - ${HOME}/.postgresql/root.crt:/root/.postgresql/root.crt:ro
    environment:
      - DISABLE_SCHEDULER=true
